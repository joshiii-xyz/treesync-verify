[package]
name = "treesync-verify"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A local file-tree equivalence verifier with explicit comparison policies"
license = "MIT"
repository = "https://github.com/joshiii-xyz/treesync-verify"
keywords = ["filesystem", "verification", "symlink", "hardlink", "integrity"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
